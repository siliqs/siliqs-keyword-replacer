name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發布的 tag（例如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Tesseract OCR
        run: |
          choco install tesseract --no-progress -y
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Add Traditional Chinese language data
        shell: pwsh
        run: |
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_tra.traineddata" `
            -OutFile "$tessdata\chi_tra.traineddata"

      - name: Install LibreOffice (legacy .doc/.xls engine)
        run: choco install libreoffice-fresh --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # 沒過測試就不發版
        run: pytest -q

      - name: Stage Tesseract for bundling
        shell: pwsh
        run: |
          # 只帶必要的：執行檔、DLL、以及 eng / osd / chi_tra 三份語言資料。
          # 完整安裝含所有語言超過 100 MB，挑過之後大約 35 MB。
          $source = "C:\Program Files\Tesseract-OCR"
          $target = "vendor/tesseract"
          New-Item -ItemType Directory -Force -Path "$target/tessdata" | Out-Null
          Copy-Item "$source/*.exe" $target
          Copy-Item "$source/*.dll" $target
          foreach ($lang in @("eng", "osd", "chi_tra")) {
            Copy-Item "$source/tessdata/$lang.traineddata" "$target/tessdata/"
          }
          if (Test-Path "$source/LICENSE") { Copy-Item "$source/LICENSE" "$target/LICENSE-Tesseract" }
          "{0:N1} MB" -f ((Get-ChildItem $target -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Build exe
        # Tesseract 一起打包進去，使用者不必自己安裝就能用 OCR
        run: pyinstaller --onefile --windowed --paths . --add-data "vendor/tesseract;tesseract" --name KeywordReplacer src/main.py

      - name: Smoke test the built exe (OCR must work without installed Tesseract)
        shell: pwsh
        run: |
          # 把系統安裝的 Tesseract 移出 PATH，確認 exe 用的真的是內建那份
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike "*Tesseract*" }) -join ';'
          # --windowed 是 GUI 程式，用 & 呼叫 PowerShell 不會等它跑完，必須 Start-Process -Wait
          $proc = Start-Process -FilePath "./dist/KeywordReplacer.exe" `
            -ArgumentList "--src","tests/samples","--out","exe_out","--keyword","Secret" `
            -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "exe 以 exit $($proc.ExitCode) 結束" }
          $report = "exe_out/snoopy_folder/_report.csv"
          if (-not (Test-Path $report)) { throw "exe 沒有產生報表" }
          Get-Content $report
          $scanned = Select-String -Path $report -Pattern "scanned_text.pdf"
          if ($scanned -notmatch "OK,1") { throw "內建 Tesseract 沒有生效：掃描 PDF 未取代" }
          Write-Host "內建 Tesseract 驗證通過"

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/KeywordReplacer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  KeywordReplacer.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          gh release create $tag dist/KeywordReplacer.exe dist/SHA256SUMS.txt `
            --title $tag --notes-file RELEASE_NOTES.md
