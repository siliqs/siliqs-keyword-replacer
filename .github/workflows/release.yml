name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發布的 tag（例如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Tesseract OCR
        run: |
          choco install tesseract --no-progress -y
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Add Traditional Chinese language data
        shell: pwsh
        run: |
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_tra.traineddata" `
            -OutFile "$tessdata\chi_tra.traineddata"

      - name: Install LibreOffice (legacy .doc/.xls engine)
        run: choco install libreoffice-fresh --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # 沒過測試就不發版
        run: pytest -q

      - name: Build exe
        run: pyinstaller --onefile --windowed --paths . --name KeywordReplacer src/main.py

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/KeywordReplacer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  KeywordReplacer.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          gh release create $tag dist/KeywordReplacer.exe dist/SHA256SUMS.txt `
            --title $tag --notes-file RELEASE_NOTES.md
