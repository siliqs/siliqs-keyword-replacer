name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Tesseract OCR
        run: |
          choco install tesseract --no-progress -y
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Add Traditional Chinese language data
        shell: pwsh
        run: |
          # choco 的 tesseract 只帶英文；chi_tra 另外抓，OCR 的中文測試才跑得到
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_tra.traineddata" `
            -OutFile "$tessdata\chi_tra.traineddata"
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --list-langs

      - name: Measure Tesseract footprint
        shell: pwsh
        run: |
          # 發佈版會把 Tesseract 打包進 exe，體積要盯著
          $dir = "C:\Program Files\Tesseract-OCR"
          "完整安裝 {0:N1} MB" -f ((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Install LibreOffice (legacy .doc/.xls engine)
        run: choco install libreoffice-fresh --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --durations=10

      - name: CLI smoke test on sample files
        shell: pwsh
        run: |
          # 用 python 跑 CLI：--windowed 的 exe 沒有 console，接不到輸出
          python src/main.py --src tests/samples --out ci_out --keyword 機密 --keyword Secret
          if (-not (Test-Path "ci_out/snoopy_folder/_report.csv")) { throw "報表未產生" }
          Get-Content "ci_out/snoopy_folder/_report.csv"

      - name: Build exe
        # --paths . 是必要的：main.py 用 sys.path 引導 src 套件，PyInstaller 分析階段看不到
        run: pyinstaller --onefile --windowed --paths . --name KeywordReplacer src/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: KeywordReplacer-exe
          path: dist/KeywordReplacer.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-smoke-report
          path: ci_out/snoopy_folder/_report.csv
